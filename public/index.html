<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML QR Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;600;700&family=Montserrat:wght@400;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Lora:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;600;700;800&family=Nunito:wght@400;700;800&family=Playfair+Display:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs4.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
  body { background:#0d4ea6; font-family:Poppins, sans-serif; padding:6px 16px; }
  .wrap { max-width:1110px; margin:0 auto; background:#e8edf2; border-radius:4px; padding:16px 20px 12px; }
  .head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .step { background:#3d3d3d; color:#fff; font-weight:700; font-size:14px; padding:4px 12px; border-radius:4px; margin-right:14px; letter-spacing:-.3px; }
  .head-left { display:flex; align-items:center; font-size:15px; color:#333; }
  .head-right { font-size:12.5px; color:#333; }
  .head-right a { color:#2a7ae2; }
  label.t { font-weight:600; font-size:14px; color:#333; margin-bottom:6px; }
  #title { height:42px; border:1px solid #c9d0d6; border-radius:3px; margin-bottom:8px; }
  .card-box { background:#fff; border-radius:6px; padding:16px 15px 16px; }
  .note-editor.note-frame { border:none; margin:0; }
  .note-toolbar { background:#fff !important; border:none !important; padding:0 0 12px !important; }
  .note-toolbar .note-btn { background:#e9edf1; border:none; color:#222; height:32px; min-width:30px; padding:0 7px; font-size:14px; }
  .note-toolbar .note-btn:hover { background:#dbe1e7; }
  .note-btn-group { margin-right:5px !important; }
  .note-btn.btn-template { background:#ff2a7f !important; color:#fff !important; padding:0 10px; font-size:15px; }
  .note-editing-area { border:1px dashed #cfd5da; background:#fafafa; }
  .note-editable { background:#fafafa !important; min-height:450px; font-family:Poppins; font-size:14px; }
  .note-statusbar { background:#e9edf1 !important; border:none !important; }
  .note-codable { min-height:450px; background:#1e1e1e !important; color:#d4d4d4 !important; font-family:Consolas, monospace; }
  .req { color:#f00; font-size:14px; margin:8px 0 6px; display:none; }
  .bottom { background:#fff; border-radius:4px; padding:10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:8px; }
  .btn-gen { background:#e3e3e3; color:#888; border:none; padding:8px 13px; font-size:14px; border-radius:2px; }
  .btn-gen.on { background:#0d4ea6; color:#fff; }
  .btn-prev { background:#ff2a7f; color:#fff; border:none; padding:8px 16px; font-size:14px; border-radius:2px; }
  .btn-prev:hover { background:#e01e6c; color:#fff; }
  .info { font-size:12.5px; color:#333; }
  .info i { color:#2a7ae2; }
  #previewModal .modal-dialog { max-width:1000px; }
  #previewModal iframe { width:100%; height:75vh; border:0; background:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-left"><span class="step">STEP 1</span>Create your HTML landing page and generate QR code</div>
    <div class="head-right"><i class="fas fa-info-circle"></i> Learn how to track data with <a href="#">dynamic QR codes</a></div>
  </div>

  <label class="t" for="title">Title of your page</label>
  <input id="title" class="form-control" type="text">

  <div class="card-box">
    <textarea id="editor"></textarea>
  </div>

  <div class="req" id="req">Required field</div>

  <div class="bottom">
    <button class="btn-gen" id="gen" disabled>Generate dynamic QR code</button>
    <button class="btn-prev" id="previewBtn"><i class="fas fa-eye"></i> Preview</button>
    <span class="info"><i class="fas fa-info-circle"></i> We only provide dynamic QR codes for HTML QR code.</span>
  </div>
</div>

<!-- Preview modal -->
<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="previewTitle">Preview</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body p-2"><iframe id="previewFrame" sandbox="allow-scripts allow-popups"></iframe></div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-bs4.min.js"></script>
<script src="ai-builder.js"></script>
<script src="templates.js"></script>
<script>
let draftTimer; // autosave timer used by refresh(), which the editor already calls while starting up

// Custom buttons
let ui; // set from the editor context (summernote 0.8.20 exposes ui per-instance)
const withUi = fn => ctx => { ui = ctx.ui; return fn(ctx); };
const magicBtn = ctx => ui.buttonGroup([
  ui.button({ className:'dropdown-toggle', contents:'<i class="fas fa-magic"></i>', tooltip:'Effects', data:{toggle:'dropdown'} }),
  ui.dropdown({ items:['Uppercase','Lowercase','Highlight box','Shadow text'], click: e => {
    e.preventDefault();
    const v = $(e.target).closest('[data-value]').data('value'); const sel = window.getSelection().toString() || 'Text';
    const map = { 'Uppercase':`<span style="text-transform:uppercase">${sel}</span>`, 'Lowercase':`<span style="text-transform:lowercase">${sel}</span>`,
      'Highlight box':`<span style="background:#fff3a0;padding:2px 6px;border-radius:3px">${sel}</span>`, 'Shadow text':`<span style="text-shadow:2px 2px 4px #888">${sel}</span>` };
    ctx.invoke('editor.pasteHTML', map[v]);
  }})
]).render();
const anchorBtn = ctx => ui.buttonGroup([
  ui.button({ className:'dropdown-toggle', contents:'<i class="fas fa-anchor"></i>', tooltip:'Anchor', data:{toggle:'dropdown'} }),
  ui.dropdown({ items:['Insert anchor','Link to anchor'], click: e => {
    e.preventDefault(); const v = $(e.target).closest('[data-value]').data('value');
    const name = prompt('Anchor name:'); if (!name) return;
    ctx.invoke('editor.pasteHTML', v === 'Insert anchor' ? `<a id="${name}" name="${name}"></a>` : `<a href="#${name}">${window.getSelection().toString() || name}</a>`);
  }})
]).render();
const audioBtn = ctx => ui.button({ contents:'<i class="fas fa-volume-up"></i>', tooltip:'Insert audio', click: () => {
  const u = prompt('Audio URL (mp3):'); if (u) ctx.invoke('editor.pasteHTML', `<audio controls src="${u}"></audio>`);
}}).render();
const uploadBtn = ctx => ui.button({ contents:'<i class="fas fa-long-arrow-alt-up"></i>', tooltip:'Upload file', click: () => {
  const i = $('<input type="file">').on('change', function(){ const f = this.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => ctx.invoke('editor.pasteHTML', `<a href="${r.result}" download="${f.name}">${f.name}</a>`); r.readAsDataURL(f); });
  i.click();
}}).render();
const galleryBtn = ctx => ui.button({ contents:'<i class="far fa-images"></i>', tooltip:'Image gallery', click: () => ctx.invoke('imageDialog.show') }).render();

$('#editor').summernote({
  height: null, minHeight: 450,  // grows with the page, so on-page editing needs no inner scrolling
  disableDragAndDrop: true,       // sections are dragged with their Move button instead
  fontNames: ['Poppins','Arial','Roboto','Open Sans','Montserrat','Lato','Merriweather','Lora','Libre Baskerville','Inter','Nunito','Playfair Display','Georgia','Times New Roman','Courier New','Verdana'],
  fontNamesIgnoreCheck: ['Poppins','Roboto','Open Sans','Montserrat','Lato','Merriweather','Lora','Libre Baskerville','Inter','Nunito','Playfair Display'],
  fontSizes: ['8','9','10','11','12','14','16','18','20','24','28','32','36','48','64'],
  toolbar: [
    ['style', ['style']],
    ['magic', ['magic','anchor']],
    ['font', ['bold','underline','clear']],
    ['fontname', ['fontname']],
    ['fontsize', ['fontsize']],
    ['color', ['color']],
    ['para', ['ul','ol','paragraph']],
    ['table', ['table']],
    ['insert', ['link','gallery','picture','audio','video','upload']],
    ['view', ['codeview','fullscreen']],
    ['history', ['undo','redo','print']],
    ['tpl', ['template','save','ai']]
  ],
  buttons: { magic:withUi(magicBtn), anchor:withUi(anchorBtn), template:HTMLQR_TPL.button, save:HTMLQR_TPL.saveButton, audio:withUi(audioBtn), upload:withUi(uploadBtn), gallery:withUi(galleryBtn), ai:HTMLQR_AI.button,
    print: ctx => (ui = ctx.ui) && ui.button({ contents:'<i class="fas fa-print"></i>', tooltip:'Print', click: () => { const w = window.open(''); w.document.write(buildDoc()); w.document.close(); w.print(); } }).render() },
  callbacks: { onChange: refresh, onKeyup: refresh }
});
$('.note-style .dropdown-toggle').find('i').replaceWith('Styles library');
$('.note-toolbar .note-history').before('<div style="height:0"></div>'); // second row starts at undo, as on the original
$('.note-fontname .note-current-fontname').text('Poppins');
$('#editor').summernote('fontName', 'Poppins');

// Returns current HTML, also when user is in </> code view
function getHTML() {
  const $c = $('.note-codable');
  return $('#editor').summernote('codeview.isActivated') ? $c.val() : $('#editor').summernote('code');
}
function isEmpty() { return $('<div>').html(getHTML()).text().trim() === '' && !/<(img|video|audio|iframe|table)/i.test(getHTML()); }
function buildDoc() { return docFor(getHTML(), $('#title').val() || 'Preview'); }
// Wraps editor HTML into a standalone page (used by Preview, Print and template thumbnails)
function docFor(html, title) {
  if (/<html[\s>]/i.test(html) || /<!doctype/i.test(html)) return html; // full HTML document typed
  title = $('<div>').text(title).html();
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Montserrat:wght@400;600;700;800&family=Lato:wght@400;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;600;700&family=Merriweather:wght@400;700&family=Lora:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;600;700;800&family=Nunito:wght@400;700;800&family=Playfair+Display:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Poppins,sans-serif;font-size:14px;padding:${/data-sec=/.test(html) ? 0 : 16}px;margin:0;word-wrap:break-word}img,video{max-width:100%;height:auto}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px}</style></head><body>${html}
<script>/* inside a srcdoc preview, "#section" links would load the editor page; scroll within the preview instead */
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();var t=document.getElementById(a.getAttribute('href').slice(1));if(t)t.scrollIntoView({behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'});});<\/script></body></html>`;
}
function refresh() {
  const ok = !isEmpty() && $('#title').val().trim() !== '';
  $('#gen').prop('disabled', !ok).toggleClass('on', ok);
  $('#req').toggle(isEmpty());
  // autosave the work in progress so a reload brings it back
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { try { localStorage.setItem('htmlqr-draft', JSON.stringify({ title: $('#title').val(), html: getHTML() })); } catch (e) {} }, 400);
}
$('#title').on('input', refresh);
$(document).on('input', '.note-codable', refresh);

$('#previewBtn').on('click', () => {
  $('#previewTitle').text($('#title').val() || 'Preview');
  document.getElementById('previewFrame').srcdoc = buildDoc();
  $('#previewModal').modal('show');
});
$('#gen').on('click', () => alert('QR code generation would happen here for: ' + $('#title').val()));

// Restore draft
try { const d = JSON.parse(localStorage.getItem('htmlqr-draft')); if (d) { $('#title').val(d.title); $('#editor').summernote('code', d.html); } } catch(e){}
HTMLQR_AI.restore();
refresh();
</script>
</body>
</html>
